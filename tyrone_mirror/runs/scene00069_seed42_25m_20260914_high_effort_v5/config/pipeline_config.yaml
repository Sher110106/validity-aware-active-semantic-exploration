# --- LLM Configuration ---
### load dynamically in Python with os.getenv, make sure you set it
GOOGLE_API_KEY: null
LLM_MODEL_NAME: "openrouter:deepseek/deepseek-v4.1-flash"
LLM_COMPLETION_PROMPT: |
  You are a scene expansion assistant that adds plausible new objects and rooms to an existing spatial layout.

  Context:
  - Input includes:
      1. YAML scene graph of current layout.
      2. Visual images matching the YAML.
  - Node types: object, room, nothing (confirmed empty), structure (impassable barrier like a wall).
  - Units: meters (m).

  Goal:
  - Add as many new objects (at least 5) and rooms as are semantically and geometrically plausible. Place new objects in both existing and new rooms.
  - VALIDATE every NEW OBJECT using the collision tool.
  - Create edges between:
      - New objects and rooms
      - New rooms and rooms
  - Ensure all additions are semantically and geometrically logical.

  Rules:
  1. Validation Protocol:
     - For objects (in any room): You MUST use the tool 'check_collision'.
         - Propose (label, center_x, center_y, center_z) and dimensions.
         - If IoU > 0.0: Move object and retry.
         - If IoU = 0.0: Keep object.
     - For rooms: Do NOT use the tool. You should intelligently select a best exit (e.g., extending from a Hallway), then project a few meters outward into the empty space to place the new room node.
     - Only output items where the objects have passed validation.
  2. Provide one YAML code block containing ONLY the new items that passed the collision check.
  3. Structure nodes (Wall, Curtain, Window, Blind) are impassable if there is no door on them. Items cannot be placed across them unless a 'door' exists. This rule is the most important one.
  4. New objects must NOT overlap with:
      - nothing nodes
      - structure nodes
      - existing object nodes
  5. When adding a new room, position it logically relative to adjacent rooms and their objects, ensuring the new room's own objects are not placed unusually close to objects in another room.
  6. Do not create new 'nothing', 'structure', or 'door' nodes. Scene has no outdoor space or dining room. Scene may contain more than one bedroom and more than one bathroom.
  7. If a door exists on a structure node and no room is currently defined on the other side, create a new room behind it.
  8. Follow exact YAML schema as the input.
  9. Pay attention to partial enclosures where some sides are bounded by walls and others are open. It maybe a plausible location for new objects or a new room.

LLM_ENSEMBLE_COUNT: 4
LLM_REFINE_TIMES: 1
MAX_PARALLEL_WORKERS: 8

# --- Navigation Parameters ---
# How many degrees the agent turns at each step
TURN_STEP_DEG: 1.5
# How many meters the agent moves forward at each step
MOVE_STEP_M: 0.075
# Distance from the target point at which the agent stops moving
DISTANCE_THRESHOLD_M: 0.25
# Angle difference from the target orientation at which the agent stops turning and begins moving forward
TURN_THRESHOLD_RAD: 0.17453292519943295   # math.radians(10)
# The radius we want to inflate obstacles by
INFLATION_RADIUS: 0
# The minimum navigation time in seconds (a workaround for only having occupancy grid in the front of the agent). This ensures the agent turns long enough
# to find a valid path.
MINIMUM_NAVIGATION_DURATION: 13.0
ESDF_THRESHOLD: 0.05
# These two parameters are not used
PATH_LENGTH_FACTOR: 5
UNKNOWN_CELL_THRESHOLD: 0.4

# --- Uncertainty Calculation ---
# Number of candidate viewpoints to sample
UNCERTAINTY_SAMPLES: 300
# Number of perturbations to apply to each scene graph (total graphs = perturbations + original)
UNCERTAINTY_PERTURBATIONS: 3
# Minimum and maximum perturbation applied to object positions in meters
UNCERTAINTY_NOISE_LOW: -0.25
UNCERTAINTY_NOISE_HIGH: 0.25
# Unlikely to use the logic, so not important.
MINIMUM_DISTANCE_DIFFERENCE: 1.0
# Weights for different components of the uncertainty score
UNCERTAINTY_ROOM_WEIGHT: 1.0
MOVE_COST_LAMBDA: 0.2

